name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # DSH peer deps are published under @deepseek-ai/*; install them as dev
      # deps so `tsc --noEmit` can resolve the public type surface.
      - name: Install dependencies
        run: |
          npm install --no-save \
            typescript@^5.6.3 \
            @deepseek-ai/cordis@^4.0.1 \
            @deepseek-ai/schemastery@^3.18.0 \
            @deepseek-ai/dsh-session-projection@^0.1.0-rc.8 \
            @deepseek-ai/dsh-session@^0.1.0-rc.8 \
            @deepseek-ai/dsh-llm@^0.1.0-rc.8
      - name: Typecheck
        run: npx tsc --noEmit
